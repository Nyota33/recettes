[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recettes"
version = "0.1.0"
description = "Build a static recipe website from Markdown files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "python-frontmatter>=1.1", "markdown-it-py>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
recettes = "recettes.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/recettes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
